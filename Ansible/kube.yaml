---
- name: Deploy Kubernetes Application
  hosts: k8s
  remote_user: ec2-user
  gather_facts: yes
  tasks:
    - name: Copy deployment.yaml to Kubernetes master
      copy:
        src: /var/lib/jenkins/workspace/JPetShop/deployment.yaml
        dest: /home/ec2-user/
      become: yes
      become_user: root
    - name: Apply Deployment
      command: kubectl apply -f /home/ec2-user/deployment.yaml
      become: yes
      become_user: root
